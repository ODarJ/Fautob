name: ObetyPl Daily Scenic Video

on:
  workflow_dispatch:
    inputs:
      scenery:
        description: "Optional scenery idea (leave blank for AI to choose)"
        required: false
        type: string
        default: ""

  schedule:
    # Every day at 01:00 UTC = 08:00 Thailand time
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: obetypl-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit state updates cleanly
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ObetyPl video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          INPUT_SCENERY: ${{ inputs.scenery }}
        run: python make_video.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obetypl-video-${{ github.run_number }}
          path: |
            output/ObetyPl_*.mp4
            output/plan.json
            output/caption.txt
            output/music_report.json
            output/attribution.txt
            output/quality_report.json
            data/content_history.json
            data/music_manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist content history
        if: success()
        run: |
          git config user.name "ObetyPl Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit the small state files — never MP4s, secrets, or work/
          git add data/content_history.json data/music_manifest.json || true
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: update ObetyPl content history [skip ci]"
            # Push with concurrency safety; ignore non-fast-forward race
            git push || echo "WARNING: history push failed (possible concurrent run)"
          fi
